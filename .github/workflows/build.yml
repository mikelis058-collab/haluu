name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: halo-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.0
          build-root-directory: halo-client
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: halo-jar
          path: |
            halo-client/build/libs/halo-*.jar
            !halo-client/build/libs/*-sources.jar
